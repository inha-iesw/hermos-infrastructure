[package]
name = "hermos_heaphook"
version = "2.3.5"
edition = "2021"
license = "Apache-2.0"
authors = [
    "Takahiro Ishikawa-Aso <sykwer@gmail.com>",
    "Ryuta Kambe <veqcc.c@gmail.com>",
    "Atsushi Yano <atsushi.yano.2@tier4.jp>",
    "Koichi Imai <koichi.imai.2@tier4.jp>"
]
description = "A heap runtime replacement for HERMOS"

[lib]
crate-type = ["cdylib"]

[features]
test-observation = []

[dependencies]
libc = "0.2"
# `unstable` exposes `allocation_usable_size`, used to find a freed block's extent for
# physical-page reclaim (see src/reclaim.rs). Cargo.lock pins this unstable API.
rlsf = { version = "0.2", features = ["unstable"] }
