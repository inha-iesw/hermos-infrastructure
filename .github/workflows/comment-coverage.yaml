name: comment-coverage

on:
  workflow_run:
    workflows: ["build-and-test-hermoslib-components-heaphook"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ros_distro: [humble, jazzy]
    steps:
      - name: Check if coverage artifact exists
        id: check_artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_NAME="coverage-report-${{ matrix.ros_distro }}"
          ARTIFACT_EXISTS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq ".artifacts | map(select(.name == \"$ARTIFACT_NAME\")) | length")
          if [ "$ARTIFACT_EXISTS" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Coverage artifact not found (C++ files may not have changed), skipping"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download coverage artifact
        if: steps.check_artifact.outputs.exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-${{ matrix.ros_distro }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post coverage comment
        if: steps.check_artifact.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_ROS_DISTRO: ${{ matrix.ros_distro }}
        run: |
          # Bind the destination to GitHub's triggering run, never PR artifact data.
          # Fork runs without a unique pull_requests association intentionally skip
          # comments; no artifact-supplied PR number is accepted as a fallback.
          PR_NUMBER=$(python3 -c '
          import json, os
          with open(os.environ["GITHUB_EVENT_PATH"]) as stream:
              requests = json.load(stream)["workflow_run"]["pull_requests"]
          if len(requests) != 1:
              raise SystemExit(1)
          number = requests[0]["number"]
          if type(number) is not int or number <= 0:
              raise SystemExit(1)
          print(number)
          ') || {
            echo "No unique pull request associated with this run; skipping comment"
            exit 0
          }
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          {
            printf '<details>\n<summary>Coverage Report (%s)</summary>\n\n```\n' "$COVERAGE_ROS_DISTRO"
            cat coverage.txt
            printf '\n```\n</details>\n'
          } > "$body_file"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
